[project]
name = "patchowner"
version = "0.1.0"
description = "Only verified, relevant, actionable vulnerability notices, routed to the person who can act."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.scripts]
patchowner = "patchowner.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patchowner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are a style choice here; the limit above is for ruff format

[tool.ruff.lint.per-file-ignores]
"patchowner/web.py" = ["B008"]  # File(...) / Form(...) in defaults is how FastAPI declares parameters
